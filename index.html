<!DOCTYPE html>
<html lang="es-CL">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#9B5DE5">
    <title>Salud Marrana 🐷</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>🐷 Salud Marrana</h1>
            <button class="btn-logout" onclick="cerrarSesion()">Salir</button>
        </header>

        <main class="app-content">
            <div class="card-bienvenida">
                <h2 id="saludo">Hola 👋</h2>
                <p>Bitácora de salud familiar</p>
            </div>

            <div class="seccion">
                <div class="seccion-titulo">La familia</div>
                <div id="loading-miembros" class="loading-pantalla" style="min-height: 200px;">
                    <div class="spinner-grande"></div>
                    <p>Cargando familia...</p>
                </div>
                <div class="miembros-grid" id="miembros-grid"></div>
            </div>

            <div class="seccion">
                <div class="seccion-titulo">Acciones rápidas</div>
                <div class="acciones-rapidas">
                    <button class="btn-accion" onclick="alert('Próximo paso 👀')">
                        <span class="emoji">➕</span>
                        Nuevo evento
                    </button>
                    <button class="btn-accion" onclick="alert('Próximo paso 👀')">
                        <span class="emoji">📊</span>
                        Reportes
                    </button>
                    <button class="btn-accion" onclick="alert('Próximo paso 👀')">
                        <span class="emoji">📁</span>
                        Documentos
                    </button>
                    <button class="btn-accion" onclick="alert('Próximo paso 👀')">
                        <span class="emoji">⏰</span>
                        Recordatorios
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/dashboard.js"></script>

    <script>
        (async () => {
            const ok = await protegerPagina();
            if (!ok) return;

            // Saludo según hora del día
            const hora = new Date().getHours();
            const saludoEl = document.getElementById('saludo');
            if (hora < 12) saludoEl.textContent = 'Buenos días 👋';
            else if (hora < 19) saludoEl.textContent = 'Buenas tardes 👋';
            else saludoEl.textContent = 'Buenas noches 👋';

            // Cargar dashboard
            await renderizarDashboard();
        })();
    </script>
</body>
</html>
