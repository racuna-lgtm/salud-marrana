<!DOCTYPE html>
<html lang="es-CL">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#9B5DE5">
    <title>Salud Marrana 🐷 - Iniciar sesión</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <div class="emoji">🐷</div>
                <h1>Salud Marrana</h1>
                <p class="subtitulo">Bitácora de salud familiar</p>
            </div>

            <div id="mensaje-error" class="mensaje-error"></div>

            <div class="form-group">
                <label for="email">Correo</label>
                <input
                    type="email"
                    id="email"
                    class="form-input"
                    placeholder="tu@correo.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    class="form-input"
                    placeholder="••••••••"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button id="btn-login" class="btn-primary">
                Entrar
            </button>
        </div>
    </div>

    <!-- Supabase JS desde CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/auth.js"></script>

    <script>
        // Si ya hay sesión activa, redirigir al dashboard
        (async () => {
            const session = await verificarSesion();
            if (session) {
                window.location.href = 'index.html';
            }
        })();

        // Manejar el login al hacer click
        document.getElementById('btn-login').addEventListener('click', async () => {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('btn-login');
            const errorEl = document.getElementById('mensaje-error');

            errorEl.classList.remove('activo');

            if (!email || !password) {
                errorEl.textContent = 'Completa correo y contraseña';
                errorEl.classList.add('activo');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Entrando...';

            const resultado = await iniciarSesion(email, password);

            if (resultado.error) {
                errorEl.textContent = resultado.error;
                errorEl.classList.add('activo');
                btn.disabled = false;
                btn.textContent = 'Entrar';
            } else {
                window.location.href = 'index.html';
            }
        });

        // Permitir login con Enter
        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('btn-login').click();
            }
        });
    </script>
</body>
</html>
